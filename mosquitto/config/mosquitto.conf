# Dev-only configuration. Anonymous access is enabled for local development.
# DO NOT use this configuration in production.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all

listener 1883 0.0.0.0
allow_anonymous true

# --- Pont vers broker.hivemq.com : module 1 (firmware ESP32 / Wokwi) ---------
#
# La carte ESP32 simulée dans Wokwi ne peut pas atteindre ce Mosquitto, qui
# tourne sur une machine locale. Elle publie donc sur un broker public, et ce
# pont rapatrie ses messages ici en leur rendant leur topic Digi4 :
#
#   digi5/equipe-ehpad/ehpad/vitals/resident/R021   (distant, broker public)
#                   -> ehpad/vitals/resident/R021   (local, ce broker)
#
# Backend, moteur d'alertes, ML, ws-gateway et dashboard sont donc inchangés :
# du point de vue du backend, la carte est un producteur comme le simulateur.
#
# Le sens est "in" uniquement : rien de ce qui circule ici ne part vers le
# broker public. L'état des résidents, les alertes et les scores de risque ne
# sortent pas de la machine.
#
# Le préfixe digi5/<equipe>/ est indispensable : broker.hivemq.com est public et
# partagé par toute la promo, un topic ehpad/... nu recevrait les messages des
# autres équipes. Changer "equipe-ehpad" ici ET dans TEAM_ID du sketch.ino.
#
# Données fictives uniquement. Aucune donnée réelle ne doit transiter par ce
# broker public, et aucun identifiant n'est utilisé ici (connexion anonyme).
connection digi5-wokwi
address broker.hivemq.com:1883
bridge_protocol_version mqttv311
remote_clientid ehpad-bridge-equipe-ehpad
cleansession true
try_private false
notifications false

topic vitals/resident/+ in 0 ehpad/ digi5/equipe-ehpad/ehpad/
topic motion/resident/+ in 0 ehpad/ digi5/equipe-ehpad/ehpad/
topic alerts/new        in 0 ehpad/ digi5/equipe-ehpad/ehpad/
